tabs:
    fields:
        title:
            label: 'humlnetcreative.pages::lang.page.field.title.label'
            span: left
            required: 1
            type: text
            permissions: humlnetcreative.pages.page.update
        slug:
            label: 'humlnetcreative.pages::lang.page.field.slug.label'
            span: right
            required: 1
            defaultFrom: title
            preset:
                field: title
                type: slug
            type: text
            permissions: humlnetcreative.pages.page.update
        parent:
            label: 'humlnetcreative.pages::lang.page.field.parent.label'
            nameFrom: title
            emptyOption: 'humlnetcreative.pages::lang.page.field.parent.prompt'
            span: left
            type: relation
            modelScope: filterParents
            permissions: humlnetcreative.pages.page.update
        fullslug:
            label: 'humlnetcreative.pages::lang.page.field.fullslug.label'
            span: auto
            type: text
            required: 1
            permissions: humlnetcreative.pages.page.update
            defaultFrom: title
            dependsOn:
                - parent
                - title
                - slug
        menu:
            label: 'humlnetcreative.pages::lang.page.field.menu.label'
            span: left
            type: dropdown
            dependsOn:
                - parent
            permissions: humlnetcreative.pages.page.update
            emptyOption: 'humlnetcreative.pages::lang.page.field.menu.prompt'
        slider:
            label: 'humlnetcreative.pages::lang.page.field.slider.label'
            span: right
            type: relation
            nameFrom: title
            permissions: humlnetcreative.pages.page.slider
            emptyOption: 'humlnetcreative.pages::lang.page.field.slider.prompt'
        breadcrumb:
            label: 'humlnetcreative.pages::lang.page.field.breadcrumb.label'
            type: dropdown
            span: left
            options:
                auto: 'humlnetcreative.pages::lang.page.field.breadcrumb.option.auto'
                manual: 'humlnetcreative.pages::lang.page.field.breadcrumb.option.manual'
            permissions: humlnetcreative.pages.page.update
            value: auto
        breadcrumb_url:
            label: "\_"
            span: right
            trigger:
                action: show
                field: breadcrumb
                condition: value[manual]
            type: pagefinder
        sort_order:
            label: 'humlnetcreative.pages::lang.page.field.sort_order.label'
            span: left
            type: number
            dependsOn:
                - parent
                - title
            permissions: humlnetcreative.pages.page.reorder
            required: 1
        contents:
            type: partial
            path: $/humlnetcreative/pages/models/page/_contents.htm
            permissions: humlnetcreative.pages.content
        meta_title:
            label: 'humlnetcreative.pages::lang.page.field.meta_title.label'
            span: left
            commentAbove: 'humlnetcreative.pages::lang.page.field.meta_title.comment'
            tab: 'humlnetcreative.pages::lang.page.tab.meta.label'
            attributes:
                data-counter: 1
                data-min: 30
                data-max: 60
                data-seo: title
        meta_description:
            label: 'humlnetcreative.pages::lang.page.field.meta_description.label'
            type: textarea
            span: left
            tab: 'humlnetcreative.pages::lang.page.tab.meta.label'
            attributes:
                data-counter: 1
                data-min: 100
                data-max: 160
                data-seo: description
