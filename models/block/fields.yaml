fields:
    is_published:
        label: 'humlnetcreative.pages::lang.block.field.is_published.label'
        type: switch
        default: true
        span: left
    title:
        label: 'humlnetcreative.pages::lang.block.field.title.label'
        span: left
        required: 1
        type: text
        permissions: humlnetcreative.pages.block.update
        comment: "humlnetcreative.pages::lang.block.field.title.comment"
    heading:
        label: 'humlnetcreative.pages::lang.block.field.heading.label'
        span: right
        type: text
        comment: 'humlnetcreative.pages::lang.block.field.heading.comment'
    sort_order:
        label: 'humlnetcreative.pages::lang.block.field.sort_order.label'
        span: left
        type: number
        permissions: humlnetcreative.pages.block.reorder
        required: 1
    is_fluid:
        label: 'humlnetcreative.pages::lang.block.field.is_fluid.label'
        span: left
        type: switch
    no_gutters:
        label: 'humlnetcreative.pages::lang.block.field.no_gutters.label'
        span: left
        type: switch
    no_gutters_breakpoint:
        label: 'humlnetcreative.pages::lang.block.field.no_gutters_breakpoint.label'
        span: left
        type: dropdown
        default: lg
        trigger:
            action: show
            field: no_gutters
            condition: checked
    padding:
        type: nestedform
        span: full
        form:
            fields:
                top:
                    label: 'humlnetcreative.pages::lang.block.field.padding_top.label'
                    type: rangeselector
                    span: auto
                    max: 10
                    default: 7

                bottom:
                    label: 'humlnetcreative.pages::lang.block.field.padding_bottom.label'
                    type: rangeselector
                    span: auto
                    max: 10
                    default: 7

                top_sm:
                    label: 'humlnetcreative.pages::lang.block.field.padding_top_sm.label'
                    type: rangeselector
                    span: auto
                    max: 10
                    default: 5

                bottom_sm:
                    label: 'humlnetcreative.pages::lang.block.field.padding_bottom_sm.label'
                    type: rangeselector
                    span: auto
                    max: 10
                    default: 5
    border:
        type: nestedform
        span: full
        form:
            fields:
                top:
                    label: 'humlnetcreative.pages::lang.block.field.border_top.label'
                    type: rangeselector
                    span: auto
                    max: 10
                    unit: px
                    default: 0

                bottom:
                    label: 'humlnetcreative.pages::lang.block.field.border_bottom.label'
                    type: rangeselector
                    span: auto
                    max: 10
                    unit: px
                    default: 0
    type:
        label: 'humlnetcreative.pages::lang.block.field.type.label'
        optionsMethod: getTypeOptions
        showSearch: true
        span: full
        type: blocktypeselector
        required: 1
    switch_order:
        label: 'humlnetcreative.pages::lang.block.field.switch_order.label'
        span: left
        type: switch
        default: false
        trigger:
            action: show
            field: type
            condition: 'values[image_text]'
    image:
        label: 'humlnetcreative.pages::lang.block.field.image.label'
        span: left
        type: fileupload
        maxItems: 1
        fileTypes: png, jpg, jpeg, webp, svg
        trigger:
            action: show
            field: type
            condition: 'values[image_text]'
    text:
        label: 'humlnetcreative.pages::lang.block.field.text.label'
        span: full
        type: richeditor
        size: huge
        trigger:
            action: show
            field: type
            condition: 'value[text][image_text]'
    posts_category:
        label: 'humlnetcreative.pages::lang.block.field.posts_category.label'
        span: left
        type: relation
        emptyOption: 'humlnetcreative.pages::lang.block.field.posts_category.empty_option'
        trigger:
            action: show
            field: type
            condition: 'value[posts][posts_slider]'
    flashmessages_category:
        label: 'humlnetcreative.pages::lang.block.field.flashmessages_category.label'
        span: left
        type: relation
        emptyOption: 'humlnetcreative.pages::lang.block.field.flashmessages_category.empty_option'
        trigger:
            action: show
            field: type
            condition: 'value[flash_message]'
    links_category:
        label: 'humlnetcreative.pages::lang.block.field.links_category.label'
        span: left
        type: relation
        nameFrom: title
        trigger:
            action: show
            field: type
            condition: 'value[links][links_slider]'
    row_cols:
        label: 'humlnetcreative.pages::lang.block.field.row_cols.label'
        span: left
        type: dropdown
        default: 4
        trigger:
            action: show
            field: type
            condition: 'value[posts][posts_slider][links][links_slider]'
    items_per_page:
        label: 'humlnetcreative.pages::lang.block.field.items_per_page.label'
        span: right
        default: 4
        trigger:
            action: show
            field: type
            condition: 'value[posts]'
    partial:
        label: 'humlnetcreative.pages::lang.block.field.partial.label'
        span: left
        type: dropdown
        trigger:
            action: show
            field: type
            condition: 'value[partial][posts][links][links_slider][posts_slider][image_text]'
        dependsOn:
            - type
    slider:
        label: 'humlnetcreative.pages::lang.block.field.slider.label'
        span: left
        type: relation
        nameFrom: title
        trigger:
            action: show
            field: type
            condition: 'value[slider]'
    embed:
        label: 'humlnetcreative.pages::lang.block.field.embed.label'
        span: left
        type: textarea
        trigger:
            action: show
            field: type
            condition: 'value[embed]'
    posts_sort_order:
        label: 'humlnetcreative.pages::lang.block.field.posts_sort_order.label'
        span: right
        type: dropdown
        trigger:
            action: show
            field: type
            condition: 'value[posts][posts_slider]'
    more_button_is_published:
        label: 'humlnetcreative.pages::lang.block.field.more_button_is_published.label'
        type: switch
        default: false
        span: left
        trigger:
            action: show
            field: type
            condition: 'value[posts][posts_slider][links][links_slider]'
    more_button_title:
        label: 'humlnetcreative.pages::lang.block.field.more_button_title.label'
        span: right
        trigger:
            action: show
            field: more_button_is_published
            condition: checked
    more_button_link:
        label: 'humlnetcreative.pages::lang.block.field.more_button_link.label'
        span: left
        type: pagefinder
        required: true
        trigger:
            action: show
            field: type
            condition: 'value[posts][posts_slider][links][links_slider]'
    variables:
        label: 'humlnetcreative.pages::lang.block.field.variables.label'
        span: right
        type: repeater
        prompt: 'humlnetcreative.pages::lang.block.field.variables.prompt'
        itemsExpanded: false
        trigger:
            action: show
            field: type
            condition: 'value[partial]'
        form:
            fields:
                name:
                    label: 'humlnetcreative.pages::lang.block.field.variables.field.name.label'
                    span: left
                type:
                    label: 'humlnetcreative.pages::lang.block.field.variables.field.type.label'
                    span: right
                    type: dropdown
                    options:
                        text: 'humlnetcreative.pages::lang.block.field.variables.field.type.option.text.label'
                        link: 'humlnetcreative.pages::lang.block.field.variables.field.type.option.link.label'
                value:
                    label: 'humlnetcreative.pages::lang.block.field.variables.field.value.label'
                    span: left
                    trigger:
                        action: show
                        field: type
                        condition: 'value[text]'

                link:
                    label: 'humlnetcreative.pages::lang.block.field.variables.field.link.label'
                    type: pagefinder
                    span: left
                    trigger:
                        action: show
                        field: type
                        condition: 'value[link]'

    options_inherited:
        label: 'humlnetcreative.pages::lang.block.field.options_inherited.label'
        type: switch
        span: auto
        default: true

    options_slider:
        type: nestedform
        form: $/humlnetcreative/pages/models/block/slider.yaml
        dependsOn:
            - type
            - options_inherited
        trigger:
            action: show
            field: type
            condition: 'value[slider]'

    options_flash_message:
        type: nestedform
        form: $/humlnetcreative/pages/models/block/flash-message.yaml
        dependsOn:
            - type
            - options_inherited
        trigger:
            action: show
            field: type
            condition: 'value[flash_message]'

    options_links:
        type: nestedform
        form: $/humlnetcreative/pages/models/block/links.yaml
        dependsOn:
            - type
            - options_inherited
        trigger:
            action: show
            field: type
            condition: 'value[links][links_slider]'

    options_image_text:
        type: nestedform
        form: $/humlnetcreative/pages/models/block/image-text.yaml
        dependsOn:
            - type
            - options_inherited
        trigger:
            action: show
            field: type
            condition: 'value[image_text]'

    options_text:
        type: nestedform
        form: $/humlnetcreative/pages/models/block/text.yaml
        dependsOn:
            - type
            - options_inherited
        trigger:
            action: show
            field: type
            condition: 'value[text]'

    options_posts:
        type: nestedform
        form: $/humlnetcreative/pages/models/block/posts.yaml
        dependsOn:
            - type
            - options_inherited
        trigger:
            action: show
            field: type
            condition: 'value[posts][posts_slider]'

    options_partial:
        type: nestedform
        form: $/humlnetcreative/pages/models/block/partial.yaml
        dependsOn:
            - type
            - options_inherited
        trigger:
            action: show
            field: type
            condition: 'value[partial][embed][contact_form]'
